# Met à jour la liste des objets utilisés dans les stuffs de Huzounet (web/huz.json).
# Lancement manuel (Actions → « Stuffs Huzounet » → Run workflow) et chaque lundi.
name: Stuffs Huzounet
on:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * 1'
permissions:
  contents: write
jobs:
  huz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/huz_items.py
      - name: Enregistrer
        run: |
          git config user.name "atelier-kamas-bot"; git config user.email "actions@users.noreply.github.com"
          git add web/huz.json
          git diff --cached --quiet && echo "rien de neuf" && exit 0
          git commit -m "Stuffs Huzounet : liste des objets mise à jour"
          git pull --rebase && git push
