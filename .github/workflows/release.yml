# Construit l'appli pour Windows, macOS et Linux, puis publie une release GitHub.
# Déclenchement : pousser un tag vX.Y.Z (même numéro que app/package.json),
# ou Actions → « Release » → Run workflow.
name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version à publier (ex. v2.0.0)'
        required: true
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            cmd: dist:win
          - os: macos-latest
            cmd: dist:mac
          - os: ubuntu-latest
            cmd: dist:linux
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: app
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install --no-audit --no-fund
      - run: npm run ${{ matrix.cmd }}
      - uses: actions/upload-artifact@v4
        with:
          name: pkg-${{ matrix.os }}
          if-no-files-found: error
          path: |
            app/dist/*.exe
            app/dist/*.dmg
            app/dist/*-macOS.zip
            app/dist/*.AppImage
            app/dist/*.deb
  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: out, merge-multiple: true }
      - name: Publier
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          T="${{ github.event.inputs.tag || github.ref_name }}"
          ls -la out
          printf '%s\n' \
            "**Windows** : \`AtelierKamas-…-Windows-Installation.exe\` (installateur) ou \`…-Windows-Portable.exe\` (sans installation). Au premier lancement : « Informations complémentaires » → « Exécuter quand même »." \
            "" \
            "**macOS** (Intel et Apple Silicon) : \`AtelierKamas-…-macOS.dmg\`. Appli non signée : la première fois, clic droit sur l'appli → Ouvrir (ou Réglages Système → Confidentialité et sécurité → Ouvrir quand même)." \
            "" \
            "**Linux** : \`AtelierKamas-…-Linux.AppImage\` (\`chmod +x\` puis lancer) ou le paquet \`.deb\`." > notes.md
          gh release view "$T" >/dev/null 2>&1 || gh release create "$T" --target "${{ github.sha }}" --title "Atelier Kamas $T" --notes-file notes.md
          gh release upload "$T" out/* --clobber
